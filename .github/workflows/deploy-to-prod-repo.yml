name: Deploy to Production Repository

on:
  push:
    branches:
      - main  # or 'master' - check your default branch
  workflow_dispatch:  # Manual trigger from GitHub UI

# Permissions for creating GitHub releases and deploying
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Test job - ensures quality before deployment
  test:
    name: 🧪 Test Angular Application
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ghanhass/spacex_repository
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: 🧪 Run unit tests with Karma
        run: npm run test:ci
      
      - name: 📊 Upload test coverage (optional)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Build and deploy to production repository
  build-and-deploy:
    name: 🏗️ Build & Deploy to Production Repo
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: 🔄 Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ghanhass/spacex_repository
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: 🏗️ Build Angular app for production
        run: |
          # Create temporary directory for production build
          mkdir -p dist/spacex_repository
          npm run build:prod -- --base-href=/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      
      - name: 🚀 Deploy to production repository using angular-cli-ghpages
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}  # Personal Access Token for prod repo
        run: |
          # Install angular-cli-ghpages
          npm install -g angular-cli-ghpages
          
          # Deploy to production repository
          npx angular-cli-ghpages --dir=dist/spacex_repository/browser \
            --repo=https://github.com/ghanhass/spacex-prod.git \
            --name="GitHub Actions Bot" \
            --email="actions@github.com" \
            --no-silent \
            --branch=gh-pages
      
      - name: ✅ Create deployment marker
        run: |
          echo "✅ Successfully deployed to https://ghanhass.github.io/spacex-prod/"
          echo "Deployment time: $(date)"

  # Alternative: Using git commands directly (more control)
  build-and-deploy-git:
    name: 🏗️ Build & Deploy (Git Method)
    runs-on: ubuntu-latest
    needs: test
    if: false  # Disable this if using the angular-cli-ghpages method above
    
    steps:
      - name: 🔄 Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ghanhass/spacex_repository
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-parts
      
      - name: 🏗️ Build Angular app
        run: npm run build:prod -- --base-href=/
      
      - name: 🚀 Clone and push to production repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # Create temporary directory for prod repo
          mkdir -p /tmp/prod-repo
          cd /tmp/prod-repo
          
          # Clone production repository
          git clone https://x-access-token:${GH_TOKEN}@github.com/ghanhass/spacex-prod.git
          cd spacex-prod
          
          # Remove old files
          git rm -rf . || true
          
          # Copy new build files
          cp -r ${{ github.workspace }}/dist/spacex_repository/browser/* .
          
          # Create .nojekyll file for GitHub Pages
          touch .nojekyll
          
          # Commit and push
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy from spacex_repository@${GITHUB_SHA::7}
          
          Build time: $(date -u)
          Triggered by: ${{ github.actor }}
          Commit: ${{ github.event.head_commit.message }}"
          
          git push origin gh-pages --force