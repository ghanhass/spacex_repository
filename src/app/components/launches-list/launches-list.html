<div class="container-launches">
  <h1 class="mat-headline-medium title">SpaceX Launch Explorer</h1>


  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search for a mission...</mat-label>
    <input matInput type="text" [(ngModel)]="searchTerm" placeholder="Ex. Crew-1" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>


  <div class="launches-grid-wrapper">
    <div class="launches-grid">
      @for (launch of filteredLaunches(); track $index) {
      <mat-card class="launch-card" (click)="goToLaunch(launch)">
        <mat-card-header>
          <img mat-card-avatar [src]="launch.links?.patch?.small" alt="Mission's patch">
          <mat-card-title>{{ launch.name }}</mat-card-title>
          <mat-card-subtitle>Flight n°{{ launch.flight_number }}</mat-card-subtitle>
          <a class="mark-favorite-btn">	<mat-icon>star_border</mat-icon></a>
        </mat-card-header>

        <mat-card-content class="card-content">
          <p class="date-text">
            <mat-icon>calendar_today</mat-icon>
            {{ launch.date_local | date:'dd/MM/yyyy' }}
          </p>
        </mat-card-content>

        <mat-card-actions class="card-actions">
          <mat-chip-set>
            <mat-chip [class.status-success]="launch.success" [class.status-error]="!launch.success">
              {{ launch.success ? 'Success' : 'Failure' }}
            </mat-chip>
          </mat-chip-set>
        </mat-card-actions>
      </mat-card>
      }
    </div>
  </div>
</div>
